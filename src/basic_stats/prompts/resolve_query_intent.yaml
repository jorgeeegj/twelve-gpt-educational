    - players_summary
    - teams_summary
    - player_match
    - player_match_event
    - team_match

  entity_type:
    - player
    - team

  aggregation:
    - sum
    - avg
    - max
    - min
    - count_matches_positive
    - points
    - wins
    - goal_difference

  ranking_mode:
    - top_n
    - ordinal
    - entity_value

