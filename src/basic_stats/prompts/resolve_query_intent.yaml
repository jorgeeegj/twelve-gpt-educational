json_schema:
  table_scope: string
  entity_type: string
  metric: string
  aggregation: string
  match_conditions: array|null
  filters:
    player_name: string|null
    team_name: string|null
    opponent_team_name: string|null
    position: string|null
    is_home: boolean|null
    opponent_rank_lte: integer|null
    opponent_rank_gte: integer|null
    opponent_rank_between: array|null
    opponent_is_big6: boolean|null
    matchday_start: integer|null
    matchday_end: integer|null
    min_minutes: integer|null
    min_matches: integer|null
    age_lt: integer|null
  ranking:
    mode: string
    n: integer|null
    ordinal: integer|null

