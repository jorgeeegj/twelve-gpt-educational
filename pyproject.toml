[project]
name = "twelve-gpt-educational"
version = "0.1.0"
description = "TwelveGPT Educational — data-driven football chatbot framework"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0.post1",
    "pandas>=2.2.0",
    "requests==2.29.0",
    "streamlit==1.31.0",
    "numpy>=1.26.3",
    "openai==2.15.0",
    "google-generativeai==0.7.2",
    "tiktoken",
    "python-jose==3.3.0",
    "polars>=1.0.0",
    "pyarrow",
    "duckdb>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
    "F401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*", "run_*"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]
